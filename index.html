    <!-- Title com 58 caracteres: cabe inteiro no resultado do Google sem corte.

    <!-- Fontes da marca: Fraunces (títulos) + Outfit (corpo).
         A versão anterior carregava Inter aqui e Outfit por @import no CSS —
         duas famílias baixadas, uma delas nunca usada, e uma cascata serial
         que atrasava o LCP. Agora é uma requisição só, com preconnect. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
