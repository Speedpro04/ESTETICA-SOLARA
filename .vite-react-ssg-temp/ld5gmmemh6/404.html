<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Página não encontrada | Solara Estética</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root { --ink:#241B29; --rose:#A4566B; --gold:#8A6636; --muted:#6B5F71; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: #FFFFFF; color: var(--ink);
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      main { max-width: 560px; text-align: center; }
      img { width: 160px; height: auto; display: block; margin: 0 auto 40px; }
      h1 {
        font-family: 'Fraunces', Georgia, serif; font-weight: 400;
        font-size: clamp(1.8rem, 6vw, 2.6rem); letter-spacing: -0.02em;
        margin: 0 0 16px; line-height: 1.2;
      }
      p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 0 0 32px; }
      a.botao {
        display: inline-block; background: var(--rose); color: #fff; text-decoration: none;
        padding: 16px 32px; border-radius: 3px; font-weight: 700; font-size: 1rem;
      }
      a.simples { color: var(--gold); text-decoration: none; font-weight: 600; }
      .rodape { margin-top: 32px; font-size: 0.9rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-solara-estetica.webp" width="160" height="117" alt="Solara Estética" />
      <h1>Esta página não existe.</h1>
      <p>
        O endereço pode ter mudado ou o link veio com algum caractere a mais.
        A página inicial continua no lugar de sempre.
      </p>
      <a class="botao" href="/">Voltar para a página inicial</a>
      <div class="rodape">
        Precisa falar com a gente?
        <a class="simples" href="mailto:contato@solaraestetica.online">contato@solaraestetica.online</a>
      </div>
    </main>
  </body>
</html>
